name: Build and Deploy ML Backend to Azure

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'app/backend/speech-monitoring-v1/**'
      - 'app/backend/telemetry-analytics-v1/**'
      - 'app/backend/diagnostic-fusion-v1/**'
      - 'app/backend/adaptive-tutoring-v1/**'
      - 'app/backend/api/requirements.txt'
      - 'Dockerfile.azure'
      - 'requirements-azure.txt'
      - 'azure_gateway.py'
      - '.dockerignore'
      - '.github/workflows/azure-ml-deploy.yml'

env:
  ACR_NAME: "sipsaramlacr26"
  IMAGE_NAME: "sipsara-ml-backend"
  WEBAPP_NAME: "sipsara-ml-backend-v2"
  RESOURCE_GROUP: "SipsaraMLGroup"
  IMAGE_TAG: ${{ github.sha }}

concurrency:
  group: azure-ml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Validate deployment credentials
      env:
        ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
      run: |
        test -n "$ACR_PASSWORD" || (echo "ACR_PASSWORD secret is required" && exit 1)
        test -n "$PUBLISH_PROFILE" || (echo "AZURE_WEBAPP_PUBLISH_PROFILE secret is required" && exit 1)

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ env.ACR_NAME }}.azurecr.io
        username: ${{ env.ACR_NAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and Push Docker image
      run: |
        TAGGED_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${{ github.sha }}"
        docker build -f Dockerfile.azure -t "$TAGGED_IMAGE" .
        docker push "$TAGGED_IMAGE"
        echo "IMAGE_REF=$TAGGED_IMAGE" >> "$GITHUB_ENV"

    - name: Deploy container image to Azure App Service
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        images: '${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}'

    - name: Verify gateway and all component readiness
      run: |
        BASE_URL="https://${WEBAPP_NAME}.azurewebsites.net"
        for attempt in {1..20}; do
          if curl --fail --silent --show-error "$BASE_URL/ready" >/dev/null; then
            echo "Azure gateway and all ML services are ready."
            exit 0
          fi
          echo "Waiting for Azure services (attempt $attempt/20)..."
          sleep 15
        done
        echo "Azure services did not become ready within timeout."
        exit 1
