name: Trigger Render API Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'app/backend/api/**'
      - '.github/workflows/render-api-deploy.yml'

jobs:
  deploy-to-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        # Only runs if the secret is set, preventing failures if not configured yet
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering deployment to Render..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo -e "\nRender deployment triggered successfully!"
