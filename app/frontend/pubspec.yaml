name: sipsara_app
description: "Sipsara - Learn, Play & Grow! An adaptive learning app for grade 1 students."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.0.0
  font_awesome_flutter: ^11.0.0
  http: ^1.1.0
  audioplayers: ^5.2.1
  shared_preferences: ^2.5.5
  intl: ^0.19.0
  google_sign_in: ^7.2.0
  aad_oauth: ^1.0.1
  device_info_plus: ^12.4.0
  uuid: ^4.6.0
  image_picker: ^1.2.3
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  fl_chart: ^1.2.0
  share_plus: ^12.0.2
  path_provider: ^2.1.2
  url_launcher: ^6.3.0
  flutter_sound: ^9.30.0
  permission_handler: ^13.0.1
  flutter_dotenv: ^6.0.1

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/backgrounds/
    - assets/images/branding/
    - assets/images/characters/mascots/
    - assets/images/characters/human/
    - assets/images/activity_icons/
    - assets/images/activity_icons/animals/
    - assets/images/activity_icons/fruits_food/
    - assets/images/activity_icons/everyday_objects/
    - assets/images/activity_icons/vehicles/
    - assets/images/activity_icons/nature/
    - assets/images/activity_icons/body_parts/
    - assets/images/activity_icons/flowers/
    - assets/images/activity_icons/basket/
    - assets/images/activity_icons/places/
    - assets/images/activity_icons/plants/
    - assets/images/activity_icons/people/
    - assets/images/skills/
    - assets/images/games/
    - assets/images/story/
    - assets/audio/
    - assets/data/
    - assets/data/curriculum/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/branding/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
