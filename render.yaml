services:
  - type: web
    name: sipsara-auth-api
    plan: free
    env: python
    buildCommand: "pip install -r app/backend/api/requirements.txt"
    startCommand: "cd app/backend/api && uvicorn main:app --host 0.0.0.0 --port $PORT"
    buildFilter:
      paths:
        - app/backend/api/**
        - render.yaml
    envVars:
      - key: PORT
        value: 8015
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: MONGODB_URL
        sync: false
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
